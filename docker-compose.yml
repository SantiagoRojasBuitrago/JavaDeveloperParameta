version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: your_database_name
      MYSQL_USER: empleado_user
      MYSQL_PASSWORD: your_app_password #
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/your_database_name
      SPRING_DATASOURCE_USERNAME: empleado_user
      SPRING_DATASOURCE_PASSWORD: your_app_password
      SPRING_APPLICATION_NAME: empleado-rest-service
      SPRING_PROFILES_ACTIVE: docker
volumes:
  db_data: